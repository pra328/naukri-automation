name: Naukri Profile Automation

# Run daily at 6:00 AM IST (12:30 AM UTC)
on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST = 12:30 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  naukri-automation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v2
      id: setup-chrome
      with:
        chrome-version: stable
        install-dependencies: true
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create environment file
      run: |
        # Create .env file with proper handling of secrets
        {
          echo "LOGIN_METHOD=${{ secrets.LOGIN_METHOD }}"
          [ -n "${{ secrets.NAUKRI_EMAIL }}" ] && echo "NAUKRI_EMAIL=${{ secrets.NAUKRI_EMAIL }}"
          [ -n "${{ secrets.NAUKRI_PASSWORD }}" ] && echo "NAUKRI_PASSWORD=${{ secrets.NAUKRI_PASSWORD }}"
          [ -n "${{ secrets.GOOGLE_EMAIL }}" ] && echo "GOOGLE_EMAIL=${{ secrets.GOOGLE_EMAIL }}"
          [ -n "${{ secrets.PHONE_NUMBER }}" ] && echo "PHONE_NUMBER=${{ secrets.PHONE_NUMBER }}"
          if [ -f "resume.pdf" ]; then
            echo "RESUME_FILE_PATH=./resume.pdf"
          fi
        } > .env
        echo "✅ Environment file created"
        echo "🔍 LOGIN_METHOD is set to: ${{ secrets.LOGIN_METHOD }}"
        
    - name: Verify resume file
      run: |
        if [ -f "resume.pdf" ]; then
          echo "✅ Found resume.pdf in repository"
        else
          echo "❌ resume.pdf not found in repository root"
          echo "💡 Please upload your resume as resume.pdf in the repository root"
          exit 1
        fi
        
    - name: Run Naukri automation
      timeout-minutes: 15
      env:
        CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      run: |
        "$CHROME_BIN" --version
        mkdir -p logs
        set -o pipefail
        xvfb-run -a python -u main.py 2>&1 | tee "logs/naukri-${GITHUB_RUN_ID}.log"
        
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: automation-logs-${{ github.run_number }}
        path: |
          logs/
        retention-days: 30
        
    - name: Notify on success
      if: success()
      run: |
        echo "✅ Naukri automation completed successfully!"
        echo "🕐 Time: $(date)"
        echo "📊 Run ID: ${{ github.run_id }}"
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Naukri automation failed!"
        echo "🕐 Time: $(date)"
        echo "📊 Run ID: ${{ github.run_id }}"
        echo "🔍 Check the logs for details"
